<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التطبيقات - inIQ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- رأس الصفحة -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/50 py-4 px-6 text-center sticky top-0 z-10 shadow-lg">
        <h1 class="text-xl font-bold tracking-wide text-indigo-400">
            <span class="bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-md ml-1 font-mono">inIQ</span> منصة الخدمات السحابية
        </h1>
        <p class="text-xs text-slate-400 mt-1">اضغط على أي خدمة لاستعراض محتواها</p>
    </header>

    <!-- محتوى الأيقونات (شبكة 2 عمود: 4 يسار و 4 يمين - بتصميم موحد وشعار inIQ) -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex items-center">
        <div class="grid grid-cols-2 gap-4 w-full">
            
            <!-- الأيقونة 1 -->
            <button onclick="openPage('1.html', 'الخدمة الأولى - inIQ')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-750 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-2xl flex items-center justify-center font-bold text-lg mb-3 transition-colors duration-200 shadow-inner border border-indigo-500/20">
                    inIQ
                </div>
                <span class="text-sm font-semibold text-slate-200">الخدمة الأولى</span>
            </button>

            <!-- الأيقونة 2 -->
            <button onclick="openPage('2.html', 'الخدمة الثانية - inIQ')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-750 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-2xl flex items-center justify-center font-bold text-lg mb-3 transition-colors duration-200 shadow-inner border border-indigo-500/20">
                    inIQ
                </div>
                <span class="text-sm font-semibold text-slate-200">الخدمة الثانية</span>
            </button>

            <!-- الأيقونة 3 -->
            <button onclick="openPage('3.html', 'الخدمة الثالثة - inIQ')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-750 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-2xl flex items-center justify-center font-bold text-lg mb-3 transition-colors duration-200 shadow-inner border border-indigo-500/20">
                    inIQ
                </div>
                <span class="text-sm font-semibold text-slate-200">الخدمة الثالثة</span>
            </button>

            <!-- الأيقونة 4 -->
            <button onclick="openPage('4.html', 'الخدمة الرابعة - inIQ')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-750 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-2xl flex items-center justify-center font-bold text-lg mb-3 transition-colors duration-200 shadow-inner border border-indigo-500/20">
                    inIQ
                </div>
                <span class="text-sm font-semibold text-slate-200">الخدمة الرابعة</span>
            </button>

            <!-- الأيقونة 5 -->
            <button onclick="openPage('5.html', 'الخدمة الخامسة - inIQ')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-750 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-2xl flex items-center justify-center font-bold text-lg mb-3 transition-colors duration-200 shadow-inner border border-indigo-500/20">
                    inIQ
                </div>
                <span class="text-sm font-semibold text-slate-200">الخدمة الخامسة</span>
            </button>

            <!-- الأيقونة 6 -->
            <button onclick="openPage('6.html', 'الخدمة السادسة - inIQ')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-750 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-2xl flex items-center justify-center font-bold text-lg mb-3 transition-colors duration-200 shadow-inner border border-indigo-500/20">
                    inIQ
                </div>
                <span class="text-sm font-semibold text-slate-200">الخدمة السادسة</span>
            </button>

            <!-- الأيقونة 7 -->
            <button onclick="openPage('7.html', 'الخدمة السابعة - inIQ')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-750 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-2xl flex items-center justify-center font-bold text-lg mb-3 transition-colors duration-200 shadow-inner border border-indigo-500/20">
                    inIQ
                </div>
                <span class="text-sm font-semibold text-slate-200">الخدمة السابعة</span>
            </button>

            <!-- الأيقونة 8 -->
            <button onclick="openPage('8.html', 'الخدمة الثامنة - inIQ')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-750 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-2xl flex items-center justify-center font-bold text-lg mb-3 transition-colors duration-200 shadow-inner border border-indigo-500/20">
                    inIQ
                </div>
                <span class="text-sm font-semibold text-slate-200">الخدمة الثامنة</span>
            </button>

        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        جميع الحقوق محفوظة &copy; 2026 - iniq.site
    </footer>

    <!-- النافذة المنبثقة (Modal) لعرض ملفات الويب عبر iframe -->
    <div id="webModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-2xl h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-300" id="modalContainer">
            
            <!-- رأس النافذة المنبثقة -->
            <div class="flex items-center justify-between px-5 py-3 border-b border-slate-700 bg-slate-850">
                <h3 id="modalTitle" class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <span class="bg-indigo-500 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">inIQ</span> <span id="titleText"></span>
                </h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-700/50 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <!-- إطار عرض صفحة الويب الداخلية (1.html - 8.html) -->
            <div class="flex-1 bg-slate-900 w-full h-full relative">
                <iframe id="pageFrame" src="" class="w-full h-full border-0"></iframe>
            </div>

            <!-- ذيل النافذة المنبثقة مع زر إغلاق -->
            <div class="px-4 py-2.5 border-t border-slate-700 flex justify-end bg-slate-850">
                <button onclick="closeModal()" class="px-4 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition-colors">
                    إغلاق الصفحة
                </button>
            </div>

        </div>
    </div>

    <!-- كود الجافاسكريبت للتحكم -->
    <script>
        const modal = document.getElementById('webModal');
        const modalContainer = document.getElementById('modalContainer');
        const titleText = document.getElementById('titleText');
        const pageFrame = document.getElementById('pageFrame');

        function openPage(pageUrl, pageTitle) {
            titleText.innerText = pageTitle;
            pageFrame.src = pageUrl;
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('scale-95');
            modalContainer.classList.add('scale-100');
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('scale-100');
            modalContainer.classList.add('scale-95');
            
            setTimeout(() => {
                pageFrame.src = '';
            }, 300);
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>

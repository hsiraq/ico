<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التطبيقات - inIQ</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/50 py-4 px-6 text-center sticky top-0 z-10 shadow-lg">
        <h1 class="text-xl font-bold tracking-wide text-indigo-400">
            <span class="bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-md ml-1 font-mono">inIQ</span>
            منصة الخدمات السحابية
        </h1>
        <p class="text-xs text-slate-400 mt-1">اضغط على أي خدمة (20 خدمة متاحة) لاستعراض محتواها</p>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-4 flex items-center">
        <div id="servicesGrid" class="grid grid-cols-2 gap-3 w-full" aria-label="قائمة الخدمات"></div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        جميع الحقوق محفوظة &copy; 2026 - iniq.site
    </footer>

    <div id="webModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalContainer" class="bg-slate-800 border border-slate-700 w-full max-w-2xl h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="flex items-center justify-between px-5 py-3 border-b border-slate-700 bg-slate-850">
                <h3 id="modalTitle" class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <span class="bg-indigo-500 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">inIQ</span>
                    <span id="titleTestText"></span>
                </h3>
                <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-700/50 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 flex items-center justify-center transition-colors duration-200" aria-label="إغلاق النافذة">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div class="flex-1 bg-slate-900 w-full h-full relative">
                <iframe id="pageFrame" src="" class="w-full h-full border-0" title="محتوى الخدمة"></iframe>
            </div>

            <div class="px-4 py-2.5 border-t border-slate-700 flex justify-end bg-slate-850">
                <button type="button" onclick="closeModal()" class="px-4 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition-colors">
                    إغلاق الصفحة
                </button>
            </div>
        </div>
    </div>

    <script>
        const servicesGrid = document.getElementById('servicesGrid');
        const modal = document.getElementById('webModal');
        const modalContainer = document.getElementById('modalContainer');
        const titleTestText = document.getElementById('titleTestText');
        const pageFrame = document.getElementById('pageFrame');

        function renderServices() {
            const totalServices = 20;

            servicesGrid.innerHTML = Array.from({ length: totalServices }, (_, index) => {
                const serviceNumber = index + 1;
                return `
                    <button
                        type="button"
                        data-page-url="${serviceNumber}.html"
                        data-page-title="الخدمة رقم ${serviceNumber} - inIQ"
                        class="group flex flex-col items-center justify-center p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-[0.98]"
                        aria-label="فتح الخدمة ${serviceNumber}"
                    >
                        <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-xl flex items-center justify-center font-bold text-sm mb-2 transition-colors duration-200">
                            inIQ
                        </div>
                        <span class="text-xs font-semibold text-slate-200">الخدمة ${serviceNumber}</span>
                    </button>
                `;
            }).join('');

            servicesGrid.querySelectorAll('button[data-page-url]').forEach((button) => {
                button.addEventListener('click', () => {
                    openPage(button.dataset.pageUrl, button.dataset.pageTitle);
                });
            });
        }

        function openPage(pageUrl, pageTitle) {
            titleTestText.textContent = pageTitle;
            pageFrame.src = pageUrl;
            showModal();
        }

        function showModal() {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('scale-95');
            modalContainer.classList.add('scale-100');
            document.body.classList.add('overflow-hidden');
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('scale-100');
            modalContainer.classList.add('scale-95');
            document.body.classList.remove('overflow-hidden');

            setTimeout(() => {
                pageFrame.src = '';
            }, 300);
        }

        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !modal.classList.contains('pointer-events-none')) {
                closeModal();
            }
        });

        renderServices();
    </script>
</body>
</html>

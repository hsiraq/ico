<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التطبيقات والخدمات - inIQ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- رأس الصفحة -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/50 py-4 px-6 text-center sticky top-0 z-10 shadow-lg">
        <h1 class="text-xl font-bold tracking-wide text-indigo-400">
            <i class="fa-solid fa-cubes ml-2"></i> لوحة الخدمات الذكية
        </h1>
        <p class="text-xs text-slate-400 mt-1">اضغط على أي خدمة لاستعراض صفحتها الداخلية</p>
    </header>

    <!-- محتوى الأيقونات (شبكة 2 عمود: 4 يسار و 4 يمين) -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex items-center">
        <div class="grid grid-cols-2 gap-4 w-full">
            
            <!-- الأيقونة 1 -> تفتح 1.html -->
            <button onclick="openPage('1.html', 'الاحصائيات والتقارير')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-xl flex items-center justify-center text-2xl mb-3 transition-colors duration-200 shadow-inner">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <span class="text-sm font-semibold text-slate-200">الاحصائيات</span>
            </button>

            <!-- الأيقونة 2 -> تفتح 2.html -->
            <button onclick="openPage('2.html', 'إدارة الملفات')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-emerald-500/10 text-emerald-400 group-hover:bg-emerald-500 group-hover:text-white rounded-xl flex items-center justify-center text-2xl mb-3 transition-colors duration-200 shadow-inner">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <span class="text-sm font-semibold text-slate-200">الملفات</span>
            </button>

            <!-- الأيقونة 3 -> تفتح 3.html -->
            <button onclick="openPage('3.html', 'قواعد البيانات')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-amber-500/10 text-amber-400 group-hover:bg-amber-500 group-hover:text-white rounded-xl flex items-center justify-center text-2xl mb-3 transition-colors duration-200 shadow-inner">
                    <i class="fa-solid fa-database"></i>
                </div>
                <span class="text-sm font-semibold text-slate-200">قواعد البيانات</span>
            </button>

            <!-- الأيقونة 4 -> تفتح 4.html -->
            <button onclick="openPage('4.html', 'الأمان والحماية')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-rose-500/10 text-rose-400 group-hover:bg-rose-500 group-hover:text-white rounded-xl flex items-center justify-center text-2xl mb-3 transition-colors duration-200 shadow-inner">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <span class="text-sm font-semibold text-slate-200">الأمان</span>
            </button>

            <!-- الأيقونة 5 -> تفتح 5.html -->
            <button onclick="openPage('5.html', 'إدارة الخوادم')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-cyan-500/10 text-cyan-400 group-hover:bg-cyan-500 group-hover:text-white rounded-xl flex items-center justify-center text-2xl mb-3 transition-colors duration-200 shadow-inner">
                    <i class="fa-solid fa-server"></i>
                </div>
                <span class="text-sm font-semibold text-slate-200">الخوادم</span>
            </button>

            <!-- الأيقونة 6 -> تفتح 6.html -->
            <button onclick="openPage('6.html', 'سجلات النظام')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-purple-500/10 text-purple-400 group-hover:bg-purple-500 group-hover:text-white rounded-xl flex items-center justify-center text-2xl mb-3 transition-colors duration-200 shadow-inner">
                    <i class="fa-solid fa-terminal"></i>
                </div>
                <span class="text-sm font-semibold text-slate-200">السجلات</span>
            </button>

            <!-- الأيقونة 7 -> تفتح 7.html -->
            <button onclick="openPage('7.html', 'أدوات المطورين')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-blue-500/10 text-blue-400 group-hover:bg-blue-500 group-hover:text-white rounded-xl flex items-center justify-center text-2xl mb-3 transition-colors duration-200 shadow-inner">
                    <i class="fa-solid fa-code"></i>
                </div>
                <span class="text-sm font-semibold text-slate-200">المطورين</span>
            </button>

            <!-- الأيقونة 8 -> تفتح 8.html -->
            <button onclick="openPage('8.html', 'الإعدادات العامة')" 
                class="flex flex-col items-center justify-center p-5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 rounded-2xl shadow-md transition-all duration-200 active:scale-95 group">
                <div class="w-14 h-14 bg-teal-500/10 text-teal-400 group-hover:bg-teal-500 group-hover:text-white rounded-xl flex items-center justify-center text-2xl mb-3 transition-colors duration-200 shadow-inner">
                    <i class="fa-solid fa-gear"></i>
                </div>
                <span class="text-sm font-semibold text-slate-200">الإعدادات</span>
            </button>

        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        جميع الحقوق محفوظة &copy; 2026
    </footer>

    <!-- النافذة المنبثقة (Modal) لعرض ملفات الويب عبر iframe -->
    <div id="webModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-2xl h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-300" id="modalContainer">
            
            <!-- رأس النافذة المنبثقة -->
            <div class="flex items-center justify-between px-5 py-3 border-b border-slate-700 bg-slate-850">
                <h3 id="modalTitle" class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-globe text-indigo-400"></i> <span id="titleText"></span>
                </h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-700/50 hover:bg-rose-500/20 hover:text-rose-400 text-slate-400 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <!-- إطار عرض صفحة الويب الداخلية (1.html, 2.html, etc.) -->
            <div class="flex-1 bg-slate-900 w-full h-full relative">
                <iframe id="pageFrame" src="" class="w-full h-full border-0"></iframe>
            </div>

            <!-- ذيل النافذة المنبثقة مع زر إغلاق -->
            <div class="px-4 py-2.5 border-t border-slate-700 flex justify-end bg-slate-850">
                <button onclick="closeModal()" class="px-4 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition-colors">
                    إغلاق الصفحة
                </button>
            </div>

        </div>
    </div>

    <!-- كود الجافاسكريبت للتحكم بفتح وغلق الصفحات -->
    <script>
        const modal = document.getElementById('webModal');
        const modalContainer = document.getElementById('modalContainer');
        const titleText = document.getElementById('titleText');
        const pageFrame = document.getElementById('pageFrame');

        function openPage(pageUrl, pageTitle) {
            titleText.innerText = pageTitle;
            pageFrame.src = pageUrl; // تحميل الملف المطلوب داخل الـ iframe
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('scale-95');
            modalContainer.classList.add('scale-100');
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('scale-100');
            modalContainer.classList.add('scale-95');
            
            // مسح مصدر الiframe لإيقاف أي وسائط أو عمليات جارية عند الإغلاق
            setTimeout(() => {
                pageFrame.src = '';
            }, 300);
        }

        // إغلاق النافذة عند النقر في المساحة الخارجية
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
